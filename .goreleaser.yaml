# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# Release automation (Task 15). Schema reference:
# https://raw.githubusercontent.com/goreleaser/goreleaser/main/.goreleaser.yaml
version: 2

project_name: hhauto

builds:
  - id: hhauto
    main: ./cmd/hhauto
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - "^build:"
      - Merge pull request
      - Merge branch
