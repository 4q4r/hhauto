# golangci-lint config (Task 15). Schema: https://golangci-lint.run/usage/configuration/
# Format `version: "2"` matches golangci-lint v2.x (formatters live in their own section).
version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    # `gosimple` requested by spec, but golangci-lint v2 removed it as a
    # standalone linter: its S-checks are part of staticcheck's default
    # check set ("all"), so staticcheck below already covers gosimple.
    - ineffassign
    - misspell
    - unconvert
    - revive
    # Task 20: complexity gates.
    - gocyclo
    - gocognit
    - funlen
    - nestif

  settings:
    gocyclo:
      min-complexity: 20
    gocognit:
      min-complexity: 30
    funlen:
      lines: 200
      statements: 100
    nestif:
      min-complexity: 5

  exclusions:
    rules:
      # Tests may be long (table-driven); complexity gates apply to prod code only.
      - path: _test\.go
        linters:
          - funlen
          - gocyclo
          - gocognit
          - nestif

formatters:
  enable:
    - gofmt
    - goimports
